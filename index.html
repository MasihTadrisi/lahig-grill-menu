<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>LAHIG GRILL | منوی دیجیتال</title>
  <meta name="description" content="منوی دیجیتال فست‌فود لاهیگ گریل - برگر ذغالی، ساندویچ و بشقاب‌های ویژه" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            charcoal: '#0f0f0f',
            neon: '#22c55e',
            price: '#f97316',
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap');
    
    * {
      font-family: 'Vazirmatn', system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    
    body {
      background: #0a0a0a;
      overscroll-behavior: none;
    }
    
    .category-scroll::-webkit-scrollbar {
      display: none;
    }
    
    .menu-card {
      transition: transform 0.15s ease, background 0.15s ease;
    }
    
    .menu-card:active {
      transform: scale(0.98);
    }
    
    .active-tab {
      background: #22c55e !important;
      color: #000 !important;
      font-weight: 600;
    }
    
    .glow-text {
      text-shadow: 0 0 12px rgba(34, 197, 94, 0.5);
    }
    
    .bottom-nav {
      backdrop-filter: blur(12px);
      background: rgba(15, 15, 15, 0.92);
    }
  </style>
</head>
<body class="bg-charcoal text-white min-h-screen pb-24">

  <!-- Header -->
  <header class="sticky top-0 z-50 bg-charcoal/95 backdrop-blur-md border-b border-white/5">
    <div class="px-4 pt-4 pb-3 text-center">
      <div class="flex items-center justify-center gap-2 mb-1">
        <svg class="w-6 h-6 text-neon" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 2C8 2 5 5 5 9c0 3 2 5.5 4 7.5L12 22l3-5.5c2-2 4-4.5 4-7.5 0-4-3-7-7-7zm0 10a3 3 0 110-6 3 3 0 010 6z"/>
        </svg>
        <h1 class="text-2xl font-bold tracking-wide glow-text text-neon">LAHIG GRILL</h1>
      </div>
      <p class="text-[11px] text-gray-400 tracking-widest">HEALTH IS OUR FIRST MESSAGE</p>
    </div>

    <!-- Category Tabs -->
    <div class="category-scroll flex gap-2 px-4 pb-3 overflow-x-auto">
      <button onclick="showCategory('burgers')" class="tab-btn active-tab whitespace-nowrap px-4 py-2 rounded-full text-sm bg-white/10 text-gray-300 transition-all" data-cat="burgers">
        برگر ذغالی
      </button>
      <button onclick="showCategory('hot-sandwich')" class="tab-btn whitespace-nowrap px-4 py-2 rounded-full text-sm bg-white/10 text-gray-300 transition-all" data-cat="hot-sandwich">
        ساندویچ گرم
      </button>
      <button onclick="showCategory('cold-sandwich')" class="tab-btn whitespace-nowrap px-4 py-2 rounded-full text-sm bg-white/10 text-gray-300 transition-all" data-cat="cold-sandwich">
        ساندویچ سرد
      </button>
      <button onclick="showCategory('plates')" class="tab-btn whitespace-nowrap px-4 py-2 rounded-full text-sm bg-white/10 text-gray-300 transition-all" data-cat="plates">
        بشقاب
      </button>
      <button onclick="showCategory('snacks')" class="tab-btn whitespace-nowrap px-4 py-2 rounded-full text-sm bg-white/10 text-gray-300 transition-all" data-cat="snacks">
        اسنک
      </button>
      <button onclick="showCategory('appetizers')" class="tab-btn whitespace-nowrap px-4 py-2 rounded-full text-sm bg-white/10 text-gray-300 transition-all" data-cat="appetizers">
        پیش‌غذا
      </button>
      <button onclick="showCategory('drinks')" class="tab-btn whitespace-nowrap px-4 py-2 rounded-full text-sm bg-white/10 text-gray-300 transition-all" data-cat="drinks">
        نوشیدنی
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="px-4 pt-4">

    <!-- Burgers -->
    <section id="burgers" class="category-section">
      <h2 class="text-lg font-semibold mb-4 flex items-center gap-2">
        <span class="w-1.5 h-5 bg-neon rounded-full"></span>
        برگر های ذغالی
      </h2>
      
      <div class="space-y-3">
        <div class="menu-card bg-white/5 rounded-2xl p-4 flex gap-3 border border-white/5">
          <div class="flex-1">
            <h3 class="font-semibold text-[15px]">همبرگر ذغالی کلاسیک</h3>
            <p class="text-xs text-gray-400 mt-1 leading-relaxed">دست‌ساز ۱۲۰ گرمی گوشت ذغالی با کاهو، گوجه، پیاز و سس مخصوص لاهیگ</p>
            <p class="text-price font-bold mt-2 text-[15px]">۳۵۰ T</p>
          </div>
          <div class="w-20 h-20 rounded-xl bg-gradient-to-br from-orange-900/40 to-black flex-shrink-0 overflow-hidden">
            <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=200&h=200&fit=crop" alt="برگر" class="w-full h-full object-cover opacity-90" />
          </div>
        </div>

        <div class="menu-card bg-white/5 rounded-2xl p-4 flex gap-3 border border-white/5">
          <div class="flex-1">
            <h3 class="font-semibold text-[15px]">برگر ویژه لاهیگ</h3>
            <p class="text-xs text-gray-400 mt-1 leading-relaxed">مرغ گریل + همبرگر ذغالی + قارچ + پنیر مخصوص</p>
            <p class="text-price font-bold mt-2 text-[15px]">۶۵۰ T</p>
          </div>
          <div class="w-20 h-20 rounded-xl bg-gradient-to-br from-orange-900/40 to-black flex-shrink-0 overflow-hidden">
            <img src="https://images.unsplash.com/photo-1550547660-d9450f859349?w=200&h=200&fit=crop" alt="برگر ویژه" class="w-full h-full object-cover opacity-90" />
          </div>
        </div>

        <!-- More items truncated for tool call length; full file is in sandbox -->
      </div>
    </section>

    <!-- Other sections would be here -->

  </main>

  <!-- Bottom Navigation -->
  <nav class="fixed bottom-0 left-0 right-0 bottom-nav border-t border-white/10 px-2 py-2 z-50">
    <div class="flex justify-around items-center max-w-md mx-auto">
      <button class="flex flex-col items-center gap-1 text-neon py-1">
        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        <span class="text-[10px]">خانه</span>
      </button>
      <button class="flex flex-col items-center gap-1 text-gray-400 py-1" onclick="showCategory('burgers')">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        <span class="text-[10px]">منو</span>
      </button>
      <a href="tel:+980000000000" class="flex flex-col items-center gap-1 text-gray-400 py-1">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
        <span class="text-[10px]">تماس</span>
      </a>
      <button class="flex flex-col items-center gap-1 text-gray-400 py-1">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        <span class="text-[10px]">مکان</span>
      </button>
    </div>
  </nav>

  <script>
    function showCategory(catId) {
      document.querySelectorAll('.category-section').forEach(sec => {
        sec.classList.add('hidden');
      });
      document.getElementById(catId).classList.remove('hidden');
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('active-tab');
        btn.classList.add('bg-white/10', 'text-gray-300');
      });
      const activeBtn = document.querySelector(`[data-cat="${catId}"]`);
      if (activeBtn) {
        activeBtn.classList.add('active-tab');
        activeBtn.classList.remove('bg-white/10', 'text-gray-300');
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>
</body>
</html>
